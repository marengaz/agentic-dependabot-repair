version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
      exclude:
        - fastapi
        - pydantic
    open-pull-requests-limit: 1
    allow:
      - dependency-name: fastapi
      - dependency-name: pydantic
    groups:
      fastapi-pydantic-v2:
        patterns:
          - fastapi
          - pydantic
        update-types:
          - major
          - minor
          - patch
    labels:
      - dependencies
      - agent-repair
    commit-message:
      prefix: deps
